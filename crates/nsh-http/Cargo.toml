[package]
name = "nsh-http"
description = "HTTP client for Native Shell Rust apps: typed JSON decoding, timeouts, retries, middleware, token refresh, streaming and network monitoring"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["nsh", "http", "client", "fetch", "retry"]

[dependencies]
nsh-core = "0.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
nsh-engine = "0.7.1"
nsh-testing = "0.7.1"
