[package]
name = "nsh-http"
description = "HTTP client for Native Shell Rust apps: typed JSON decoding, timeouts, retries, middleware, token refresh, streaming and network monitoring"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
nsh-core = "0.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
nsh-engine = "0.5.0"
nsh-testing = "0.5.0"
