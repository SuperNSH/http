[package]
name = "nsh-app-demo-rs"
version = "0.1.0"
edition = "2024"
publish = false

# Detached from the repo workspace: this is a standalone NSH app.
[workspace]

[dependencies]
nsh-base = "0.4.0"
nsh-core = "0.4.0"
nsh-http = { path = "../../crates/nsh-http" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
env_logger = "0.11"

[dev-dependencies]
nsh-engine = "0.4.0"
nsh-testing = "0.4.0"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.4.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.4.0", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.4.0", default-features = false }
